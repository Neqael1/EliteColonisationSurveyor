name: Build and test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build EliteColonisationSurveyor.sln -c Release

      - name: Test
        run: dotnet run --project tests/EliteColonisationSurveyor.Core.Tests/EliteColonisationSurveyor.Core.Tests.csproj -c Release --no-build
